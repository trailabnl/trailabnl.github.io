<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{description}}" />
    <meta name="post-slug" content="{{slug}}" />
    <title>{{title}} - Translational AI Laboratory</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="post-page" data-slug="{{slug}}" data-category="{{category_lower}}">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="post-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">Translational AI Laboratory</a>
        <nav class="post-nav" aria-label="Post navigation">
          <a class="post-back-link" href="{{back_href}}">Back to section</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="post-hero" style="--post-hero-image: url('{{image_url}}')">
        <div class="container">
          <div class="post-hero-panel">
            <p class="post-eyebrow">{{category}}</p>
            <h1 class="post-title">{{title}}</h1>
            <p class="post-date">{{date}}</p>
          </div>
        </div>
      </section>

      <article class="post-content">
        <div class="container container--narrow">
          <div class="post-content-inner">{{content_html}}</div>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-text">Translational AI Laboratory (TrAIL)</p>
        <a class="footer-link" href="../index.html#top">Back to home</a>
      </div>
    </footer>
  </body>
</html>
